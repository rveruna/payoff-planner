name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /payoff-planner/
      - name: Build the Expo app for the web
        working-directory: mobile
        run: |
          npm ci
          npm run build:web
      - name: Publish the app at /app
        run: |
          mkdir -p dist/app
          cp -R mobile/dist/. dist/app/
          # Pages has no rewrites, so an address inside the app that is not a real file (a month, a debt, a shared link)
          # is answered with the app's own page and the app's router takes over
          cp mobile/dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
