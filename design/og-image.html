<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Link preview image</title>
    <style>
      /* The 1200 by 630 picture shown when the site is shared. The chart lines are the real sample plans: regenerate the
         paths with "npx vite-node design/og-data.ts", then open this file in a browser and screenshot the page. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #f5f7fb;
        color: #1d2433;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .panel {
        position: absolute;
        right: 60px;
        top: 70px;
        width: 600px;
        height: 490px;
        background: #fff;
        border: 2px solid #d9dee7;
        border-radius: 28px;
        padding: 36px 40px;
      }
      .panel p {
        margin: 0 0 14px;
        font-size: 24px;
        font-weight: 700;
      }
      svg {
        display: block;
      }
      main {
        position: absolute;
        left: 70px;
        top: 70px;
        width: 440px;
        height: 490px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 800;
        color: #17805a;
      }
      .mark span {
        display: inline-block;
        width: 44px;
        height: 44px;
        border-radius: 11px;
        background: #17805a;
      }
      h1 {
        margin: 0;
        font-size: 78px;
        line-height: 1;
        letter-spacing: -3px;
      }
      .sub {
        margin: 22px 0 0;
        font-size: 28px;
        line-height: 1.35;
        color: #4a5568;
      }
      .url {
        margin: 0;
        font-size: 26px;
        color: #4a5568;
      }
      .key {
        display: flex;
        gap: 26px;
        margin-top: 12px;
        font-size: 20px;
        font-weight: 600;
      }
      .key span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
